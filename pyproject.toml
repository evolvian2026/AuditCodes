[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auditcodes"
version = "0.1.0"
description = "Audit coding questions: verify, correct and export question banks with execution-backed checks."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
    "pymupdf>=1.24",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "markdown-it-py>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["auditcodes*"]

[tool.setuptools.package-data]
auditcodes = ["app/templates/*.html", "app/templates/partials/*.html", "app/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
