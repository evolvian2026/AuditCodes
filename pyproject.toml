[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auditcodes"
version = "0.1.0"
description = "Audit coding questions: verify, correct and export question banks with execution-backed checks."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "hypothesis>=6",
]

[tool.setuptools.packages.find]
include = ["auditcodes*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
